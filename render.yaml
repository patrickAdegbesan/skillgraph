# Render Blueprint for SkillGraph.
#
# SkillGraph must run as a real Node.js web service, not a static export:
# every route under /api/developers and /api/health executes server-side and
# opens a Bolt connection to CognoDB.
#
# The three CognoDB variables are declared here by NAME ONLY, with
# `sync: false`, so Render prompts for their values instead of storing them in
# this repository. Never add real credential values to this file.
services:
  - type: web
    name: skillgraph
    runtime: node
    plan: free
    branch: claude/skillgraph-phase-5
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Server-side only. Deliberately NOT prefixed NEXT_PUBLIC_, which would
      # inline them into the browser bundle at build time.
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USERNAME
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 20.20.2
